name: Build Installer ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
      options: --privileged
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: apt-get update -qq && apt-get install -y -qq live-build

      - name: Copy installer scripts into chroot
        run: |
          dest=live/config/includes.chroot/opt/simple-cluster-installer
          mkdir -p "$dest/lib"
          cp install.sh "$dest/install.sh"
          cp lib/*.sh "$dest/lib/"
          chmod +x "$dest/install.sh"

      - name: Build ISO
        working-directory: live
        run: |
          chmod +x auto/config
          lb config
          lb build

      - name: Rename ISO
        run: mv live/live-image-amd64.hybrid.iso "live/simple-cluster-installer-${{ github.ref_name }}-amd64.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-cluster-installer-iso
          path: live/simple-cluster-installer-${{ github.ref_name }}-amd64.iso
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: live/simple-cluster-installer-${{ github.ref_name }}-amd64.iso
          generate_release_notes: true
